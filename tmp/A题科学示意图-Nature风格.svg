<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1693" height="929" viewBox="0 0 1693 929">
  <title>A题烟幕干扰弹几何关系、运动过程与时间优化逻辑</title>
  <desc>导弹飞向原点假目标，烟幕云团位于导弹到真目标的直线视线之间；真目标位于正y轴的(0,200,0)。</desc>

  <image x="0" y="0" width="1693" height="929"
         xlink:href="A题科学示意图-Nature风格-base.png"/>

  <!-- Deterministic vector correction of the lower-right explanatory box. -->
  <rect x="1451" y="787" width="232" height="125" rx="8"
        fill="#faf8ff" stroke="#9b72cf" stroke-width="1.2"/>
  <text x="1465" y="818"
        font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"
        font-size="18" font-weight="500" fill="#6a24a8">
    总遮蔽时间 = 区间并集
  </text>
  <text x="1465" y="858"
        font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"
        font-size="17" fill="#242424">
    重叠部分只计一次；
  </text>
  <text x="1465" y="889"
        font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"
        font-size="17" fill="#242424">
    单枚云团有效期 ≤ 20 s。
  </text>
</svg>
